<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOTA Fitness - Ultra Premium Workout Architecture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: '#C5A059',
                        crimson: '#FF2E63',
                        darkbg: '#0B0C10',
                        cardbg: '#1F2833'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        h1, h2, h3 { font-family: 'Syne', sans-serif; }
        .gradient-text { background: linear-gradient(to bottom, #FFFFFF, #E5E5E5, #1F2833); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hover-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
    </style>
</head>
<body class="bg-darkbg text-[#E5E5E5] overflow-x-hidden min-h-screen flex flex-col justify-between">

    <nav class="fixed top-4 inset-x-0 z-40 max-w-7xl mx-auto px-4 md:px-6 py-3 rounded-full bg-[#0B0C10]/80 backdrop-blur-2xl border border-gold/20 shadow-2xl flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 shrink-0">
            <svg class="text-crimson w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m21.21 15.89-12-12-2.4 2.4-2.4 2.4-1.2 1.2M7.2 12l4.8 4.8"/></svg>
            <span class="text-2xl md:text-3xl font-black tracking-tighter text-white">MOTA</span>
        </div>

        <div class="hidden lg:flex gap-4 text-xs font-bold tracking-widest text-[#E5E5E5]/70">
            <a href="#shoulders" class="hover:text-gold transition-colors">SHOULDERS</a>
            <a href="#chest" class="hover:text-gold transition-colors">CHEST</a>
            <a href="#back" class="hover:text-gold transition-colors">BACK & DEADLIFT</a>
            <a href="#legs" class="hover:text-gold transition-colors">LEGS</a>
            <a href="#core" class="hover:text-gold transition-colors">ABS & CORE</a>
            <a href="#neck" class="hover:text-gold transition-colors">NECK</a>
        </div>

        <div class="flex items-center gap-3">
            <button id="theme-toggle" class="p-2 rounded-full border border-gold/30 hover:border-gold transition-all text-gold">🌙</button>
            <a href="#contact" class="px-4 py-2.5 rounded-full bg-gold text-darkbg font-black text-xs tracking-widest hover:bg-white transition-all">JOIN ELITE</a>
        </div>
    </nav>

    <section class="relative min-h-[50vh] flex flex-col justify-center items-center text-center px-4 pt-32 pb-8">
        <div class="relative z-10 max-w-4xl mx-auto">
            <span class="text-gold font-mono tracking-[0.3em] uppercase text-xs mb-4 block font-bold">PRO WORKOUT & FORM GUIDELINES</span>
            <h1 class="text-4xl sm:text-6xl font-black tracking-tighter mb-4 leading-none gradient-text">PRECISION EXECUTION</h1>
            <p class="text-[#E5E5E5]/70 text-sm max-w-xl mx-auto mb-6 font-light">ہر ایکسرسائز کا صحیح اور غلط طریقہ لائیو اینیمیٹڈ ڈیمو کے ساتھ دیکھیں۔</p>
            
            <div class="max-w-md mx-auto relative">
                <input type="text" id="search-input" placeholder="Search shoulder, deadlift, chest, core..." class="w-full px-6 py-3 rounded-full bg-cardbg/50 border border-gold/30 focus:border-gold focus:outline-none text-sm text-white shadow-lg placeholder-gray-400">
            </div>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 md:px-6 space-y-16 pb-20">
        <section id="shoulders">
            <h2 class="text-2xl md:text-3xl font-black mb-6 border-b border-gold/20 pb-3 text-gold">SHOULDERS & DELTS</h2>
            <div id="shoulders-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <section id="chest">
            <h2 class="text-2xl md:text-3xl font-black mb-6 border-b border-gold/20 pb-3 text-gold">CHEST PROTOCOLS</h2>
            <div id="chest-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <section id="back">
            <h2 class="text-2xl md:text-3xl font-black mb-6 border-b border-gold/20 pb-3 text-gold">BACK & DEADLIFT</h2>
            <div id="back-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <section id="legs">
            <h2 class="text-2xl md:text-3xl font-black mb-6 border-b border-gold/20 pb-3 text-gold">LEGS & LOWER BODY</h2>
            <div id="legs-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <section id="core">
            <h2 class="text-2xl md:text-3xl font-black mb-6 border-b border-gold/20 pb-3 text-gold">ABS & CORE</h2>
            <div id="core-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <section id="neck">
            <h2 class="text-2xl md:text-3xl font-black mb-6 border-b border-gold/20 pb-3 text-gold">NECK & TRAPS</h2>
            <div id="neck-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>
    </main>

    <div id="exercise-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="bg-cardbg border border-gold/40 rounded-3xl p-6 md:p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto relative text-white">
            <button id="close-modal" class="absolute top-6 right-6 text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
